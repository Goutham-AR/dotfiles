# Reference: https://github.com/i3/i3/blob/next/etc/config
config-version = 2

persistent-workspaces = []

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]
    # --- Terminal Launcher ---
    alt-enter = '''exec-and-forget osascript -e '
    tell application "Terminal"
        do script
        activate
    end tell'
    '''

    # --- Focus (HJKL) ---
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    # --- Move Windows ---
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # --- Splitting (punctuation, no letter conflicts) ---
    alt-minus = 'split horizontal'
    alt-slash = 'split vertical'

    # --- Layouts ---
    alt-f = 'fullscreen'
    alt-comma  = 'layout v_accordion'          # stacking
    alt-period = 'layout h_accordion'          # tabbed
    alt-e      = 'layout tiles horizontal vertical'
    alt-shift-space = 'layout floating tiling'

    # --- Workspaces ---
    alt-t = 'workspace T'  # Terminal (Alacritty + tmux/neovim)
    alt-v = 'workspace V'  # VSCode
    alt-b = 'workspace B'  # Brave
    alt-s = 'workspace S'  # Spotify
    alt-c = 'workspace C'  # Chat (WhatsApp/FaceTime)
    alt-m = 'workspace M'  # Email
    alt-1 = 'workspace 1'  
    alt-2 = 'workspace 2'  
    alt-3 = 'workspace 3'  


    # --- Move Node to Workspace ---
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-v = 'move-node-to-workspace V'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'

    # --- System ---
    alt-shift-r = 'reload-config'
    alt-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'


# --- Window Automation ---

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace S'

# Find your WhatsApp ID via: aerospace list-apps | grep -i whatsapp
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace M'

# Default layout for all new windows
[[on-window-detected]]
run = 'layout h_accordion'
